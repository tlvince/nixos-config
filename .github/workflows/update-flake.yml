name: Update flake
on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  lockfile:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: generate-github-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: tlvince
          repositories: nixos-config-secrets
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ steps.generate-github-token.outputs.token }}
      - name: Patch nixpkgs fork
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_FOR_PATCH_NIXPKGS }}
        run: ./.github/scripts/patch-nixpkgs.sh
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        id: update-flake-lock
        with:
          commit-msg: "chore(flake.lock): update"
          pr-body: |
            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
          pr-title: "chore(flake.lock): update"
          pr-labels: |
            automated
            dependencies
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
      - name: Update PR body with compare URLs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: steps.update-flake-lock.outputs.pull-request-operation == 'created' || steps.update-flake-lock.outputs.pull-request-operation == 'updated'
        with:
          script: |
            const compare = require('.github/scripts/compare')

            const body = await compare({ github, context, core })
            if (!body) {
              return
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.update-flake-lock.outputs.pull-request-number }},
              body,
            })
